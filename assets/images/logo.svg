<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c4dff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#311b92;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Outer ring -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="url(#grad1)" stroke-width="2" opacity="0.7"/>
  
  <!-- Inner circle (planet) -->
  <circle cx="50" cy="50" r="20" fill="url(#grad1)"/>
  
  <!-- Orbit paths -->
  <ellipse cx="50" cy="50" rx="35" ry="10" fill="none" stroke="#b388ff" stroke-width="1" opacity="0.6" transform="rotate(20 50 50)"/>
  <ellipse cx="50" cy="50" rx="35" ry="10" fill="none" stroke="#b388ff" stroke-width="1" opacity="0.6" transform="rotate(-20 50 50)"/>
  
  <!-- Small planets in orbit -->
  <circle cx="75" cy="50" r="4" fill="#b388ff" opacity="0.8"/>
  <circle cx="25" cy="50" r="3" fill="#b388ff" opacity="0.8"/>
  
  <!-- Stars -->
  <circle cx="20" cy="20" r="1.5" fill="white" opacity="0.9"/>
  <circle cx="80" cy="20" r="1" fill="white" opacity="0.7"/>
  <circle cx="30" cy="80" r="1.5" fill="white" opacity="0.8"/>
  <circle cx="70" cy="80" r="1" fill="white" opacity="0.6"/>
</svg>